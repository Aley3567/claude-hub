name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install "aiohttp>=3.9" "setuptools>=68" wheel

      - name: Install zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Check Python syntax
        run: >-
          python -m py_compile
          claude-provider-once.py
          claude-hub.py
          claude1_protocol.py
          claude1_provider.py
          claude1-turn-guard.py
          scripts/secret_guard.py

      - name: Scan repository for leaked secrets
        run: >-
          python scripts/secret_guard.py
          --working-tree
          --no-private-sources

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run shell integration tests
        run: |
          sh -n install.sh
          zsh -n zsh-functions.sh zsh-sticky-integration.sh tests/test_shell_integration.zsh tests/test_install.zsh
          ./tests/test_shell_integration.zsh
          ./tests/test_install.zsh

  desktop-smoke:
    name: Desktop smoke on macOS / Python 3.12
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install desktop extra
        run: >-
          python -m pip install --no-cache-dir
          '.[desktop]'
          'setuptools>=68'
          wheel

      - name: Verify PySide6 is importable
        run: >-
          python -c
          'import PySide6; from PySide6 import QtCore, QtWidgets;
          print(PySide6.__version__)'

      - name: Run desktop and packaging contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p "test_desktop.py" -v
          python -m unittest -v tests.test_packaging.PackagingMetadataTests
