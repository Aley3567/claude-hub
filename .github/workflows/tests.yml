name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every OS/Python result instead of cancelling sibling jobs.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install "aiohttp>=3.9" "setuptools>=68" wheel

      - name: Install zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Check Python syntax
        run: >-
          python -m py_compile
          claude-provider-once.py
          claude-hub.py
          claude1_protocol.py
          claude1_provider.py
          claude1-turn-guard.py
          scripts/secret_guard.py

      - name: Prepare isolated test home
        env:
          CLAUDE_HUB_TEST_HOME: ${{ runner.temp }}/claude-hub-home
        run: >-
          python -c
          "import os; from pathlib import Path; Path(os.environ['CLAUDE_HUB_TEST_HOME']).mkdir(parents=True, exist_ok=True)"

      - name: Scan repository for leaked secrets
        env:
          HOME: ${{ runner.temp }}/claude-hub-home
          USERPROFILE: ${{ runner.temp }}/claude-hub-home
        run: >-
          python scripts/secret_guard.py
          --working-tree
          --no-private-sources

      - name: Run full Python test suite on Unix
        if: runner.os != 'Windows'
        env:
          HOME: ${{ runner.temp }}/claude-hub-home
          USERPROFILE: ${{ runner.temp }}/claude-hub-home
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run cross-platform core tests on Windows
        if: runner.os == 'Windows'
        env:
          HOME: ${{ runner.temp }}/claude-hub-home
          USERPROFILE: ${{ runner.temp }}/claude-hub-home
          PIP_CONFIG_FILE: NUL
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INDEX: "1"
        run: >-
          python -m unittest -v
          tests.test_core_contract
          tests.test_switchctl
          tests.test_claude1_protocol
          tests.test_provider_policy
          tests.test_packaging
          tests.test_secret_guard

      - name: Run shell integration tests on Unix
        if: runner.os != 'Windows'
        env:
          HOME: ${{ runner.temp }}/claude-hub-home
          USERPROFILE: ${{ runner.temp }}/claude-hub-home
        run: |
          sh -n install.sh
          zsh -n zsh-functions.sh zsh-sticky-integration.sh tests/test_shell_integration.zsh tests/test_install.zsh
          ./tests/test_shell_integration.zsh
          ./tests/test_install.zsh
